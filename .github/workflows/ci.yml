name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  backend:
    name: Backend tests (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven unit tests
        run: mvn -B -pl langchat-server -am test

  frontend:
    name: Frontend typecheck & build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: langchat-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack / pnpm
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          COREPACK_NPM_REGISTRY: https://registry.npmmirror.com

      - name: Typecheck
        run: pnpm -F @vben/web-naive typecheck

      - name: Build
        run: pnpm -F @vben/web-naive build
