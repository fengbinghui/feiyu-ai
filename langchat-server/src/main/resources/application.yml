spring:
  application:
    name: langchat-server
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 520MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

sa-token:
  token-name: Authorization
  is-read-header: true
  is-read-cookie: false
  is-log: false
  is-print: false

langchat:
  # 登录失败风控（无 Redis，单机内存实现）：窗口内连续失败达到上限后锁定账号
  auth:
    login-max-attempts: ${LANGCHAT_LOGIN_MAX_ATTEMPTS:5}
    login-fail-window-minutes: ${LANGCHAT_LOGIN_FAIL_WINDOW_MINUTES:10}
    login-lock-minutes: ${LANGCHAT_LOGIN_LOCK_MINUTES:10}
  web:
    # 允许跨域访问的前端来源（逗号分隔）
    cors-allowed-origins: ${LANGCHAT_CORS_ALLOWED_ORIGINS:http://localhost:5888,http://127.0.0.1:5888}
  storage:
    type: local
    local-base-dir: /tmp/langchat-oss
  skill:
    # 技能工作区根目录；相对路径以 JAR 进程的运行目录为基准
    workspace-dir: ${LANGCHAT_SKILL_WORKSPACE_DIR:./langchat-workspace}
  core:
    knowledge:
      index:
        # 单文档向量化任务超过该时间仍未结束时自动标记失败
        task-timeout: ${LANGCHAT_KNOWLEDGE_INDEX_TASK_TIMEOUT:30m}
        # 后台检查等待中/执行中任务的间隔
        stale-task-sweep-interval: ${LANGCHAT_KNOWLEDGE_INDEX_SWEEP_INTERVAL:1m}
  mcp:
    # MCP 客户端会话缓存时长：窗口内多次 Agent 调用复用同一个 MCP 服务连接，不重复启动；
    # 过期自动回收，配置变更/删除时立即停用（主动暂停）
    session-ttl: 1h
    sweep-interval: 5m
    tool-execution-timeout: 30s
    # STDIO 模式允许启动的 Docker 镜像白名单（逗号分隔，默认空 = 全部禁止）
    stdio-image-whitelist: ${LANGCHAT_MCP_STDIO_IMAGE_WHITELIST:}
